start" fill="#333" font-size="12">09:05版本刪除09:00棒，重算極值與開盤分母；首桶縮為09:05–09:15。</text><text x="55" y="721" text-anchor="start" fill="#333" font-size="12">5分K樣本：2026-10-13～2026-11-13；15分K第一桶只有09:00一棒，無法拆分桶內時序。</text><text x="55" y="746" text-anchor="start" fill="#333" font-size="12">現貨5分K最後起始棒13:20；台指期同步截止13:20。15分K兩者同步截止13:15。</text><text x="55" y="771" text-anchor="start" fill="#333" font-size="12">收盤撮合涵蓋差異、連續近月轉倉與基差都可能影響結果；完整日盤另列於JSON。</text><text x="55" y="796" text-anchor="start" fill="#333" font-size="12">信賴區間採Wilson 95%；櫃買／加權同日差異優先採精確McNemar檢定。</text><text x="55" y="821" text-anchor="start" fill="#333" font-size="12">不同棒高低點無法還原棒內先後；先高後低將同棒極值列為平手。多重比較未校正。</text><text x="55" y="846" text-anchor="start" fill="#333" font-size="12">短期樣本與日際相依限制推論；開盤分布與振幅不能證明投機者結構的因果關係。</text></svg>
