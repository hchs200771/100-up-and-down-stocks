<style>
:root{--bg:#f7f8fa;--card:#fff;--fg:#1a202c;--muted:#64748b;--line:#e2e8f0;--accent:#2563eb;--up:#dc2626;--down:#16a34a;--chip:#eef2f7}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171e2e;--fg:#e5eaf3;--muted:#8b98ad;--line:#28334a;--accent:#7aa2ff;--up:#f87171;--down:#4ade80;--chip:#222c42}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding:16px}
.wrap{max-width:960px;margin:0 auto}
h1{font-size:20px;margin:4px 0 2px}
h2{font-size:16px;margin:22px 0 8px}
.sub,.note{color:var(--muted);font-size:13px;margin:2px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.card .t{font-weight:700}
.card .body{font-size:13.5px;line-height:1.75;margin-top:3px}
.chip{display:inline-block;background:var(--chip);border-radius:99px;padding:0 8px;font-size:11px;color:var(--muted);margin-left:4px}
.cards{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.cards .card{flex:1 1 160px;margin:0}
.cards .card b{display:block;font-size:18px;margin-top:4px}
.pos{color:var(--up)}.neg{color:var(--down)}
.stop{display:inline-block;font-size:13px;font-weight:800;border-radius:6px;padding:1px 8px;margin-right:8px;background:var(--chip);color:var(--fg)}
.stop-hit{background:var(--up);color:#fff}.stop-none{background:#f59e0b;color:#fff}
.stopcard-hit{border:2px solid var(--up)}
table.stops{min-width:0;font-size:15px}table.stops td,table.stops th{text-align:left}
.stop-row-hit td{color:var(--up);font-weight:700}.stop-row-none td{color:#d97706}
.tablebox{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,td.l{text-align:left}
td.l{white-space:normal}
th{color:var(--muted);font-weight:600}
.lock{max-width:360px;margin:48px auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.lock input[type=password]{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);margin:10px 0}
.lock button{font:inherit;font-weight:700;padding:7px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
.lock label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:12px}
.lock .err{color:var(--up);font-size:13px;min-height:1.4em;margin-top:8px}
.relock{float:right;font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;cursor:pointer}
</style>
</head>

<div class="wrap">
<nav class="nav gnav"><style>
nav.gnav{display:block;position:sticky;top:0;z-index:40;margin:0 0 14px;padding:8px 0 6px;background:var(--bg,#fff);border-bottom:1px solid var(--line,#e5e7eb);font-family:inherit}
.gnav .gnav-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gnav .gnav-g{position:relative}
.gnav .gnav-btn{display:inline-block;border:1px solid var(--line,#e5e7eb);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;line-height:1.3;background:var(--card,#fff);color:var(--fg,#374151);text-decoration:none;cursor:pointer;white-space:nowrap}
.gnav .gnav-btn:hover{border-color:var(--accent,#6366f1);color:var(--accent,#4338ca)}
.gnav .gnav-btn.on{background:var(--accent,#4f46e5);border-color:var(--accent,#4f46e5);color:#fff}
.gnav .gnav-caret{font-size:10px;margin-left:4px;opacity:.7}
.gnav .gnav-menu{display:none;position:absolute;left:0;top:100%;padding-top:6px;z-index:41;min-width:168px}
.gnav .gnav-g:nth-last-child(-n+2) .gnav-menu{left:auto;right:0}
.gnav .gnav-menu-in{background:var(--card,#fff);border:1px solid var(--line,#e5e7eb);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.14);padding:6px}
.gnav .gnav-item{display:block;border:0;border-radius:6px;padding:8px 12px;font-size:14px;font-weight:600;line-height:1.3;background:transparent;color:var(--fg,#374151);text-decoration:none;white-space:nowrap}
.gnav .gnav-item:hover{background:var(--chip,#f1f5f9);color:var(--accent,#4338ca)}
.gnav .gnav-item.on{color:var(--accent,#4338ca);background:var(--chip,#eef2ff)}
.gnav .gnav-g.open .gnav-menu{display:block}
@media (any-hover:hover){.gnav .gnav-g:hover .gnav-menu{display:block}}
.gnav .gnav-sub{display:none;gap:4px;margin-top:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gnav .gnav-sub::-webkit-scrollbar{display:none}
.gnav .gnav-sub.on{display:flex}
.gnav .gnav-subitem{flex:none;display:inline-block;border:0;border-radius:6px;padding:4px 10px;font-size:13px;font-weight:600;line-height:1.4;background:transparent;color:var(--muted,#6b7280);text-decoration:none;white-space:nowrap}
.gnav .gnav-subitem:hover{color:var(--accent,#4338ca)}
.gnav .gnav-subitem.on{background:var(--chip,#eef2ff);color:var(--accent,#4338ca)}
@media (max-width:640px){.gnav .gnav-btn{padding:6px 11px;font-size:13px}}

  async function unlock(pw){
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d(enc.s),iterations:enc.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d(enc.i)},key,d(enc.c));
    box.innerHTML=new TextDecoder().decode(pt);
    form.style.display="none";box.style.display="";
  }
  form.addEventListener("submit",async function(e){
    e.preventDefault();err.textContent="解密中…";
    var pw=form.pw.value;
    try{
      await unlock(pw);err.textContent="";
      try{(form.remember.checked?localStorage:sessionStorage).setItem(KEY,pw)}catch(x){}
    }catch(x){err.textContent="密碼不對"}
  });
  window.relock=function(){try{localStorage.removeItem(KEY);sessionStorage.removeItem(KEY)}catch(x){}location.reload()};
  var saved=store();
  if(saved)unlock(saved).catch(function(){form.style.display=""});else form.style.display="";
})();
</script>
</div>
</body>
